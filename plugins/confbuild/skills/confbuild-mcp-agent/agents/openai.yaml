interface:
  display_name: "confBuild MCP Agent"
  short_description: "Deterministic confBuild model and visual-review loop"
  default_prompt: "Use $confbuild-mcp-agent to create or refine a confBuild project with the native-first validation and four-view repair loop."

dependencies:
  tools:
    - type: "mcp"
      value: "confbuild"
      description: "OAuth-authenticated confBuild project, Sheet edit, validation, and browser-render server"
      transport: "streamable_http"
      url: "https://app.confbuild.com/mcp"

policy:
  allow_implicit_invocation: true
